[package]
name = "omarchy-macos-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Install, remove and customize the macOS theme for Omarchy"
license = "MIT"
repository = "https://github.com/tsubaie/omarchy-macos-studio"

[dependencies]
anyhow = "1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Everyday release builds: quick to rebuild, and still small.
[profile.release]
lto = "thin"
strip = true

# For packages: the smallest program, at the cost of a slower build
# (cargo build --profile dist).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
